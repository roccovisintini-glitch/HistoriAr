<!DOCTYPE html>
<html>
<head>
    <title>HistoriAr</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 600px; width: 100%; }
    </style>
</head>
<body>
<h1>Mapa Histórico Argentino 🇦🇷</h1>
<div id="map"></div>
<script>
    // Esto inicializa el mapa usando la API externa
    var map = L.map('map').setView([-34.6037, -58.3816], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Ponemos un marcador simple
    L.marker([-34.6083, -58.3712]).addTo(map)
        .bindPopup('<b>Cabildo de Bs As</b><br>Hito de 1810.')
        .openPopup();
</script>
</body>
</html>
